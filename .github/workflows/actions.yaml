name: my-github-template

on:

  pull_request:
    branches:
      - main
    types:
      - closed
    paths-ignore:
      - README.md

  push:
    branches:
      - main


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # if: github.ref == 'refs/heads/main'
  # timeout-minutes: 10

  job-1:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

  job-2:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Run
        run: npm run
      - name: Curl
        run: curl localhost:3000
