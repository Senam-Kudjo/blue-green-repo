name: my-github-template

on:
  # pull_request
  push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # if: github.ref == 'refs/heads/main'
  timeout-minutes: 10

  job-1:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

  job-2:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
      - name: echo
        run: echo hahaha
